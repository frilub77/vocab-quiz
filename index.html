<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>單字測驗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f5; --surface:#ffffff; --ink:#14232e; --muted:#5d6e7a; --line:#cfd9e0;
  --accent:#0b6e83; --accent-ink:#ffffff; --ok:#17794a; --ok-bg:#dff3e8; --bad:#b3261e; --bad-bg:#fbe3e1;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --display:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1a21; --surface:#18262f; --ink:#e6eef3; --muted:#93a5b1; --line:#2c3f4b;
    --accent:#4fc3d9; --accent-ink:#06222a; --ok:#6fd8a2; --ok-bg:#183a2a; --bad:#ff8f86; --bad-bg:#43211f;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px}
h1{font:700 1.25rem var(--sans);margin:0 0 16px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.progress{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-bottom:8px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:24px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.word{font:700 clamp(2.4rem,11vw,3.8rem) var(--display);letter-spacing:-.02em;text-align:center;margin:8px 0 28px;word-break:break-word}
.options{display:grid;gap:10px}
.opt{padding:14px 16px;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:500 1.1rem var(--sans);border-radius:10px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.primary{padding:12px 20px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:700 1rem var(--sans);cursor:pointer}
.next{margin-top:18px;width:100%}
.msg{color:var(--muted);text-align:center;padding:12px 0}
.score{font:700 3rem var(--display);text-align:center}
.wrong-list{margin:12px 0 0;padding-left:20px}
.status{color:var(--muted);font-size:.8rem;text-align:center;margin-top:14px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
  <h1>單字測驗</h1>
  <section id="quiz"></section>
  <p class="status" id="status" role="status"></p>
</main>

<script>
/* ★ 設定：把「發布到網路」的 CSV 連結貼在下面的引號內 ★ */
var SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQwrP9-ziyZfvuBaPtBPrQQBJ6xcxlhAV0wJYPquqX6sIGEhobQH-XxxUR-72UVmdEc9eIUTaZeMQue/pub?gid=0&single=true&output=csv';

(function(){
  var CACHE_KEY = 'vocab-quiz-cache-v2';
  var SAMPLE = [
    {en:'apple',zh:'蘋果'},{en:'library',zh:'圖書館'},{en:'borrow',zh:'借（入）'},
    {en:'journey',zh:'旅程'},{en:'careful',zh:'小心的'},{en:'improve',zh:'改善'}
  ];
  var words = [];
  var quiz = null;
  var $ = function(id){ return document.getElementById(id); };

  function shuffle(a){
    a = a.slice();
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function el(tag, cls, text){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text!=null) e.textContent = text;
    return e;
  }

  /* ---------- 讀取雲端題庫（Google 試算表 CSV） ---------- */
  function parseCSV(text){
    var rows = [], row = [], cell = '', q = false;
    for(var i=0;i<text.length;i++){
      var c = text[i];
      if(q){
        if(c === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
        else cell += c;
      }else if(c === '"') q = true;
      else if(c === ','){ row.push(cell); cell = ''; }
      else if(c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
      else if(c !== '\r') cell += c;
    }
    row.push(cell); rows.push(row);
    return rows;
  }
  function toWords(rows){
    var out = [], seen = {};
    rows.forEach(function(r, i){
      var en = (r[0]||'').trim(), zh = (r[1]||'').trim();
      if(!en || !zh) return;
      if(i === 0 && /^(english|word|英文|單字)$/i.test(en)) return;
      var k = en.toLowerCase();
      if(seen[k]) return;
      seen[k] = 1; out.push({en:en, zh:zh});
    });
    return out;
  }
  function cacheGet(){
    try{ var a = JSON.parse(localStorage.getItem(CACHE_KEY)); if(Array.isArray(a) && a.length) return a; }catch(e){}
    return null;
  }
  function cacheSet(a){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify(a)); }catch(e){} }

  function loadWords(){
    if(!SHEET_URL){
      words = SAMPLE; setStatus('尚未設定雲端題庫，目前使用範例單字。'); startQuiz(); return;
    }
    $('quiz').appendChild(el('p','msg','題庫載入中…'));
    var sep = SHEET_URL.indexOf('?') > -1 ? '&' : '?';
    fetch(SHEET_URL + sep + 't=' + Date.now())
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
      .then(function(t){
        words = toWords(parseCSV(t));
        if(words.length) cacheSet(words);
        setStatus('題庫共 ' + words.length + ' 個單字');
        startQuiz();
      })
      .catch(function(){
        var c = cacheGet();
        if(c){ words = c; setStatus('無法連上雲端，使用上次載入的題庫（' + c.length + ' 個單字）'); }
        else { words = SAMPLE; setStatus('無法連上雲端題庫，目前使用範例單字。'); }
        startQuiz();
      });
  }
  function setStatus(t){ $('status').textContent = t; }

  /* ---------- 測驗 ---------- */
  function startQuiz(){
    if(words.length < 4){ quiz = null; renderQuiz(); return; }
    quiz = {queue: shuffle(words), i:0, score:0, wrong:[], answered:false};
    renderQuiz();
  }
  function makeOptions(word){
    var others = shuffle(words.filter(function(w){ return w.zh !== word.zh; }));
    var picks = [], seen = {};
    for(var k=0;k<others.length && picks.length<3;k++){
      if(!seen[others[k].zh]){ seen[others[k].zh]=1; picks.push(others[k].zh); }
    }
    return shuffle(picks.concat([word.zh]));
  }
  function renderQuiz(){
    var box = $('quiz');
    box.textContent = '';
    var panel = el('div','panel');
    box.appendChild(panel);

    if(!quiz){
      panel.appendChild(el('p','msg','題庫至少需要 4 個不同的單字才能出題，請老師先到試算表新增。'));
      return;
    }
    if(quiz.i >= quiz.queue.length){
      panel.appendChild(el('p','msg','測驗完成'));
      panel.appendChild(el('div','score', quiz.score + ' / ' + quiz.queue.length));
      if(quiz.wrong.length){
        panel.appendChild(el('p','msg','答錯的單字：'));
        var ul = el('ul','wrong-list');
        quiz.wrong.forEach(function(w){ ul.appendChild(el('li',null,w.en + '：' + w.zh)); });
        panel.appendChild(ul);
      }
      var again = el('button','primary next','再測一次');
      again.onclick = startQuiz;
      panel.appendChild(again);
      return;
    }

    var cur = quiz.queue[quiz.i];
    var prog = el('div','progress');
    prog.appendChild(el('span',null,'第 ' + (quiz.i+1) + ' 題，共 ' + quiz.queue.length + ' 題'));
    prog.appendChild(el('span',null,'答對 ' + quiz.score));
    panel.appendChild(prog);
    var bar = el('div','bar'); var fill = document.createElement('i');
    fill.style.width = (quiz.i / quiz.queue.length * 100) + '%';
    bar.appendChild(fill); panel.appendChild(bar);

    panel.appendChild(el('div','word',cur.en));
    var opts = el('div','options');
    var next = el('button','primary next', quiz.i === quiz.queue.length-1 ? '看結果' : '下一題');
    next.hidden = true;
    quiz.answered = false;

    makeOptions(cur).forEach(function(text){
      var b = el('button','opt',text);
      b.onclick = function(){
        if(quiz.answered) return;
        quiz.answered = true;
        if(text === cur.zh) quiz.score++; else quiz.wrong.push(cur);
        Array.prototype.forEach.call(opts.children, function(o){
          o.disabled = true;
          if(o.textContent === cur.zh) o.classList.add('ok');
          else if(o === b) o.classList.add('bad');
        });
        next.hidden = false; next.focus();
      };
      opts.appendChild(b);
    });
    panel.appendChild(opts);
    next.onclick = function(){ quiz.i++; renderQuiz(); };
    panel.appendChild(next);
  }

  loadWords();
})();
</script>
</body>
</html>
