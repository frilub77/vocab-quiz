<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英文強強滾</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f5; --surface:#ffffff; --ink:#14232e; --muted:#5d6e7a; --line:#cfd9e0;
  --accent:#0b6e83; --accent-ink:#ffffff; --ok:#17794a; --ok-bg:#dff3e8; --bad:#b3261e; --bad-bg:#fbe3e1;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --display:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1a21; --surface:#18262f; --ink:#e6eef3; --muted:#93a5b1; --line:#2c3f4b;
    --accent:#4fc3d9; --accent-ink:#06222a; --ok:#6fd8a2; --ok-bg:#183a2a; --bad:#ff8f86; --bad-bg:#43211f;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px}
h1{font:700 1.25rem var(--sans);margin:0 0 16px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.field{margin-bottom:18px}
.field>b{display:block;margin-bottom:6px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{display:inline-block;padding:8px 14px;border:2px solid var(--line);border-radius:999px;font-weight:500}
.chip input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
select,input[type=number],input[type=text]{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:400 1rem var(--sans)}
select{width:100%}
input[type=number]{width:80px}
.progress{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-bottom:8px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.tag{display:inline-block;font-size:.85rem;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:1px 10px;margin-bottom:6px}
.wordrow{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0 24px}
.word{font:700 clamp(2.2rem,10vw,3.6rem) var(--display);letter-spacing:-.02em;text-align:center;word-break:break-word}
.zhq{font:700 clamp(1.8rem,8vw,2.6rem) var(--sans);text-align:center;margin:8px 0}
.zhq.small{font-size:clamp(1.1rem,5vw,1.4rem);color:var(--muted)}
.blanks{font:500 1.3rem monospace;letter-spacing:.15em;text-align:center;color:var(--muted);margin-bottom:12px;word-break:break-all}
.cloze{font-size:1.35rem;font-weight:500;line-height:2.5;text-align:center;margin:6px 0 18px}
.slot{display:inline-block;min-width:3.4em;margin:0 4px;padding:0 8px;border-bottom:3px solid var(--line);color:var(--muted)}
.slot.active{border-color:var(--accent)}
.slot.ok{color:var(--ok);border-color:var(--ok)}
.slot.bad{color:var(--bad);border-color:var(--bad)}
.cloze input[type=text]{font:inherit;font-size:1.1rem;padding:0 6px;margin:0 4px;text-align:center;border:0;border-bottom:3px solid var(--accent);border-radius:0;background:var(--bg);line-height:1.6}
.cloze input.ok{color:var(--ok);border-color:var(--ok)}
.cloze input.bad{color:var(--bad);border-color:var(--bad)}
.options{display:grid;gap:10px}
.opt{padding:14px 16px;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:500 1.1rem var(--sans);border-radius:10px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.primary{padding:12px 20px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:700 1rem var(--sans);cursor:pointer}
.primary:disabled{opacity:.5;cursor:default}
.ghost{padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font:500 .9rem var(--sans);cursor:pointer}
.speak{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.2rem;cursor:pointer;flex:none}
.full{width:100%;margin-top:14px}
.spell{display:flex;gap:8px;margin-top:6px}
.spell input{flex:1;font-size:1.2rem;min-width:0}
.fb{min-height:1.6em;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;text-align:center;font-weight:700;margin-top:12px}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.msg{color:var(--muted);text-align:center;padding:12px 0}
.score{font:700 3rem var(--display);text-align:center}
.wrong-list{margin:12px 0 0;padding-left:20px}
.hint{color:var(--muted);font-size:.85rem;margin:6px 0 0}
.status{color:var(--muted);font-size:.8rem;text-align:center;margin-top:14px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
  <h1>英文強強滾</h1>
  <section id="quiz"></section>
  <p class="status" id="status" role="status"></p>
</main>

<script>
/* ★ 設定：把「發布到網路」的 CSV 連結貼在下面的引號內 ★ */
var SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQwrP9-ziyZfvuBaPtBPrQQBJ6xcxlhAV0wJYPquqX6sIGEhobQH-XxxUR-72UVmdEc9eIUTaZeMQue/pub?gid=0&single=true&output=csv';

(function(){
  var CACHE = 'vocab-quiz-cache-v4', PREF = 'vocab-quiz-pref-v2';
  var PREPS = ['to','of','for','with','in','on','at','from','by','about','up','out','off','into','over','as','after','against','through'];
  var SAMPLE = [
    {kind:'word',en:'apple',zh:'蘋果',book:'範例教材',lesson:'第一課'},
    {kind:'word',en:'library',zh:'圖書館',book:'範例教材',lesson:'第一課'},
    {kind:'word',en:'borrow',zh:'借（入）',book:'範例教材',lesson:'第一課'},
    {kind:'word',en:'journey',zh:'旅程',book:'範例教材',lesson:'第二課'},
    {kind:'word',en:'careful',zh:'小心的',book:'範例教材',lesson:'第二課'},
    {kind:'word',en:'improve',zh:'改善',book:'範例教材',lesson:'第二課'},
    {kind:'cloze',en:'be sensitive ______ sth.',zh:'對…感到敏感',book:'範例教材',lesson:'第一課',ans:[['to']]},
    {kind:'cloze',en:'to have a ______ sense ______ hearing',zh:'擁有敏銳的聽覺',book:'範例教材',lesson:'第一課',ans:[['keen'],['of']]},
    {kind:'cloze',en:'be ______ on V-ing',zh:'熱衷於…',book:'範例教材',lesson:'第二課',ans:[['keen']]}
  ];
  var words = [], clozes = [], quiz = null;
  var cfg = {kind:'word', book:'', lessons:[], mode:'choice', count:'all', custom:10, auto:false};
  var $ = function(id){ return document.getElementById(id); };
  var HAS_TTS = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;

  try{ var sp = JSON.parse(localStorage.getItem(PREF)); if(sp) for(var k in sp) cfg[k] = sp[k]; }catch(e){}

  function shuffle(a){
    a = a.slice();
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function uniq(a){ return a.filter(function(x,i){ return a.indexOf(x)===i; }); }
  function norm(s){ return String(s).trim().toLowerCase().replace(/\s+/g,' '); }
  function el(tag, cls, text){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text!=null) e.textContent = text;
    return e;
  }
  function setStatus(t){ $('status').textContent = t; }
  function src(){ return cfg.kind === 'cloze' ? clozes : words; }

  /* ---------- 發音 ---------- */
  function speak(t){
    if(!HAS_TTS) return;
    try{
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(t);
      u.lang = 'en-US'; u.rate = 0.85;
      speechSynthesis.speak(u);
    }catch(e){}
  }
  function speakBtn(text){
    var b = el('button','speak','🔊');
    b.setAttribute('aria-label','朗讀');
    b.onclick = function(){ speak(text); };
    return b;
  }

  /* ---------- 讀取雲端題庫 ---------- */
  function parseCSV(text){
    var rows = [], row = [], cell = '', q = false;
    for(var i=0;i<text.length;i++){
      var c = text[i];
      if(q){
        if(c === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
        else cell += c;
      }else if(c === '"') q = true;
      else if(c === ','){ row.push(cell); cell = ''; }
      else if(c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
      else if(c !== '\r') cell += c;
    }
    row.push(cell); rows.push(row);
    return rows;
  }
  function toItems(rows){
    var out = [], seen = {}, bad = 0;
    rows.forEach(function(r, i){
      var en = (r[0]||'').trim(), zh = (r[1]||'').trim();
      if(en && !zh){
        var m = en.match(/^([\x00-\x7F]+?)\s*([^\x00-\x7F][\s\S]*)$/);
        if(m){ en = m[1].trim(); zh = m[2].trim(); }
      }
      if(!en || !zh) return;
      if(i === 0 && /^(english|word|英文|單字)$/i.test(en)) return;
      var book = (r[2]||'').trim() || '未分類教材';
      var lesson = (r[3]||'').trim() || '未分課';
      var item = {kind:'word', en:en, zh:zh, book:book, lesson:lesson};
      if(/_{2,}/.test(en)){
        item.kind = 'cloze';
        item.en = en.replace(/^\s*\d+(-\d+)?[.\s、)]+/, '');
        var n = item.en.split(/_{2,}/).length - 1;
        item.ans = (r[4]||'').split(/[;；,，]/).map(function(a){
          return a.split('/').map(function(x){ return x.trim(); }).filter(Boolean);
        }).filter(function(a){ return a.length; });
        if(item.ans.length !== n){ bad++; return; }
      }
      var key = [item.kind, item.en.toLowerCase(), book, lesson].join('|');
      if(seen[key]) return;
      seen[key] = 1; out.push(item);
    });
    return {items:out, bad:bad};
  }
  function split(items){
    words = items.filter(function(x){ return x.kind === 'word'; });
    clozes = items.filter(function(x){ return x.kind === 'cloze'; });
  }
  function cacheSet(a){ try{ localStorage.setItem(CACHE, JSON.stringify(a)); }catch(e){} }
  function cacheGet(){
    try{ var a = JSON.parse(localStorage.getItem(CACHE)); if(Array.isArray(a) && a.length) return a; }catch(e){}
    return null;
  }
  function loadItems(){
    if(!SHEET_URL){
      split(SAMPLE); setStatus('尚未設定雲端題庫，目前使用範例題目。'); renderSetup(); return;
    }
    $('quiz').appendChild(el('p','msg','題庫載入中…'));
    var sep = SHEET_URL.indexOf('?') > -1 ? '&' : '?';
    fetch(SHEET_URL + sep + 't=' + Date.now())
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
      .then(function(t){
        var res = toItems(parseCSV(t));
        split(res.items);
        if(res.items.length) cacheSet(res.items);
        setStatus('題庫共 ' + words.length + ' 個單字、' + clozes.length + ' 題句型填空' +
          (res.bad ? '（有 ' + res.bad + ' 題因空格數與答案數不符而略過）' : ''));
        renderSetup();
      })
      .catch(function(){
        var c = cacheGet();
        if(c){ split(c); setStatus('無法連上雲端，使用上次載入的題庫。'); }
        else { split(SAMPLE); setStatus('無法連上雲端題庫，目前使用範例題目。'); }
        renderSetup();
      });
  }

  /* ---------- 設定畫面 ---------- */
  function chip(type, name, value, text, checked, onchange){
    var l = el('label','chip');
    var i = document.createElement('input');
    i.type = type; i.name = name; i.value = value; i.checked = !!checked;
    i.onchange = onchange;
    l.appendChild(i); l.appendChild(el('span',null,text));
    return l;
  }
  function field(title){ var f = el('div','field'); f.appendChild(el('b',null,title)); return f; }

  function renderSetup(){
    quiz = null;
    var box = $('quiz'); box.textContent = '';
    var p = el('div','panel'); box.appendChild(p);
    if(!words.length && !clozes.length){ p.appendChild(el('p','msg','題庫是空的，請老師先到試算表新增題目。')); return; }
    if(cfg.kind === 'cloze' && !clozes.length) cfg.kind = 'word';
    if(cfg.kind === 'word' && !words.length) cfg.kind = 'cloze';

    /* 練習內容 */
    if(words.length && clozes.length){
      var f0 = field('練習內容'), c0 = el('div','chips');
      [['word','單字'],['cloze','句型填空']].forEach(function(m){
        c0.appendChild(chip('radio','kind',m[0],m[1],cfg.kind===m[0],function(){
          cfg.kind = m[0]; cfg.book = ''; cfg.lessons = []; renderSetup();
        }));
      });
      f0.appendChild(c0); p.appendChild(f0);
    }

    var books = uniq(src().map(function(w){ return w.book; }));
    if(books.indexOf(cfg.book) < 0){ cfg.book = books[0]; cfg.lessons = []; }
    var info = el('p','hint'), start = el('button','primary full','開始練習');

    function pool(){ return src().filter(function(w){ return w.book===cfg.book && cfg.lessons.indexOf(w.lesson)>=0; }); }
    function update(){
      var n = pool().length;
      info.textContent = '符合條件的題目：' + n + ' 題';
      start.disabled = !n;
    }

    /* 教材 */
    var f1 = field('教材');
    var sel = document.createElement('select');
    books.forEach(function(b){ var o = el('option',null,b); o.value = b; sel.appendChild(o); });
    sel.value = cfg.book;
    f1.appendChild(sel); p.appendChild(f1);

    /* 課次 */
    var f2 = field('課次（可複選）'), lbox = el('div','chips');
    f2.appendChild(lbox);
    var all = el('button','ghost','全選'); all.type = 'button';
    all.style.marginTop = '8px';
    f2.appendChild(all); p.appendChild(f2);
    function drawLessons(){
      lbox.textContent = '';
      var ls = uniq(src().filter(function(w){ return w.book===cfg.book; }).map(function(w){ return w.lesson; }));
      cfg.lessons = cfg.lessons.filter(function(l){ return ls.indexOf(l) >= 0; });
      if(!cfg.lessons.length) cfg.lessons = ls.slice();
      ls.forEach(function(l){
        lbox.appendChild(chip('checkbox','lesson',l,l,cfg.lessons.indexOf(l)>=0,function(e){
          if(e.target.checked) cfg.lessons.push(l);
          else cfg.lessons = cfg.lessons.filter(function(x){ return x !== l; });
          update();
        }));
      });
      all.onclick = function(){ cfg.lessons = ls.slice(); drawLessons(); update(); };
    }
    sel.onchange = function(){ cfg.book = sel.value; cfg.lessons = []; drawLessons(); update(); };
    drawLessons();

    /* 題型 */
    var f3 = field('題型'), c3 = el('div','chips');
    [['choice','選擇題'],['spell','拼寫題'],['mix','混合']].forEach(function(m){
      c3.appendChild(chip('radio','mode',m[0],m[1],cfg.mode===m[0],function(){ cfg.mode = m[0]; }));
    });
    f3.appendChild(c3); p.appendChild(f3);

    /* 題數 */
    var f4 = field('題數'), c4 = el('div','chips');
    [['all','全部'],['10','10 題'],['20','20 題'],['custom','自訂']].forEach(function(m){
      c4.appendChild(chip('radio','count',m[0],m[1],cfg.count===m[0],function(){ cfg.count = m[0]; }));
    });
    var num = document.createElement('input');
    num.type = 'number'; num.min = 1; num.value = cfg.custom; num.setAttribute('aria-label','自訂題數');
    num.oninput = function(){ cfg.custom = parseInt(num.value,10) || 10; cfg.count = 'custom'; c4.querySelector('input[value=custom]').checked = true; };
    c4.appendChild(num);
    f4.appendChild(c4); f4.appendChild(info); p.appendChild(f4);

    /* 朗讀 */
    if(HAS_TTS){
      var f5 = el('div','field'), c5 = el('div','chips');
      c5.appendChild(chip('checkbox','auto','1','自動朗讀（單字題朗讀題目，句型題朗讀完整句子）',cfg.auto,function(e){ cfg.auto = e.target.checked; }));
      f5.appendChild(c5); p.appendChild(f5);
    }

    start.onclick = function(){
      try{ localStorage.setItem(PREF, JSON.stringify(cfg)); }catch(e){}
      var n = pool().length;
      if(cfg.count !== 'all') n = Math.min(n, cfg.count==='custom' ? Math.max(1,cfg.custom) : parseInt(cfg.count,10));
      begin(shuffle(pool()).slice(0, n));
    };
    p.appendChild(start);
    update();
  }

  /* ---------- 測驗 ---------- */
  function begin(list){
    var canChoice = uniq(words.map(function(w){ return w.zh; })).length >= 4;
    quiz = {list:list, i:0, score:0, wrong:[], types:list.map(function(it){
      if(cfg.mode==='spell') return 'spell';
      if(it.kind==='word' && !canChoice) return 'spell';
      if(cfg.mode==='choice') return 'choice';
      return Math.random() < 0.5 ? 'choice' : 'spell';
    })};
    renderQuiz();
  }
  function makeOptions(word){
    var others = shuffle(words.filter(function(w){ return w.zh !== word.zh; }));
    var picks = [], seen = {};
    for(var k=0;k<others.length && picks.length<3;k++){
      if(!seen[others[k].zh]){ seen[others[k].zh]=1; picks.push(others[k].zh); }
    }
    return shuffle(picks.concat([word.zh]));
  }
  function clozeOptions(alts){
    var bad = alts.map(norm), correct = alts[0];
    var isPrep = PREPS.indexOf(norm(correct)) >= 0;
    var bank = uniq([].concat.apply([], clozes.map(function(c){ return c.ans.map(function(a){ return a[0]; }); })))
      .filter(function(a){ return PREPS.indexOf(norm(a)) < 0; });
    var cand = isPrep ? shuffle(PREPS) : shuffle(bank).concat(shuffle(PREPS));
    var picks = [], seen = {};
    cand.forEach(function(c){
      var k = norm(c);
      if(picks.length < 3 && bad.indexOf(k) < 0 && !seen[k]){ seen[k] = 1; picks.push(c); }
    });
    return shuffle(picks.concat([correct]));
  }

  function renderQuiz(){
    var box = $('quiz'); box.textContent = '';
    var p = el('div','panel'); box.appendChild(p);
    if(quiz.i >= quiz.list.length){ renderEnd(p); return; }

    var cur = quiz.list[quiz.i], type = quiz.types[quiz.i];
    var last = quiz.i === quiz.list.length - 1;
    var prog = el('div','progress');
    prog.appendChild(el('span',null,'第 ' + (quiz.i+1) + ' 題，共 ' + quiz.list.length + ' 題'));
    prog.appendChild(el('span',null,'答對 ' + quiz.score));
    p.appendChild(prog);
    var bar = el('div','bar'), fill = document.createElement('i');
    fill.style.width = (quiz.i / quiz.list.length * 100) + '%';
    bar.appendChild(fill); p.appendChild(bar);
    p.appendChild(el('div','tag', cur.book + '・' + cur.lesson));

    var next = el('button','primary full', last ? '看結果' : '下一題');
    next.hidden = true;
    next.onclick = function(){ quiz.i++; renderQuiz(); };
    var answered = false;
    function finish(ok){
      answered = true;
      if(ok) quiz.score++; else quiz.wrong.push(cur);
      next.hidden = false; next.focus();
    }

    if(cur.kind === 'cloze') clozeBody(p, cur, type, finish);
    else if(type === 'choice'){
      var row = el('div','wordrow');
      row.appendChild(el('div','word',cur.en));
      if(HAS_TTS) row.appendChild(speakBtn(cur.en));
      p.appendChild(row);
      var opts = el('div','options');
      makeOptions(cur).forEach(function(text){
        var b = el('button','opt',text);
        b.onclick = function(){
          if(answered) return;
          Array.prototype.forEach.call(opts.children, function(o){
            o.disabled = true;
            if(o.textContent === cur.zh) o.classList.add('ok');
            else if(o === b) o.classList.add('bad');
          });
          finish(text === cur.zh);
        };
        opts.appendChild(b);
      });
      p.appendChild(opts);
      if(cfg.auto) speak(cur.en);
    }else{
      p.appendChild(el('p','hint msg','請拼出這個中文的英文單字'));
      p.appendChild(el('div','zhq',cur.zh));
      p.appendChild(el('div','blanks', cur.en.split('').map(function(c){ return /[a-z]/i.test(c) ? '_' : c; }).join(' ')));
      if(HAS_TTS){ var r = el('div','wordrow'); r.appendChild(speakBtn(cur.en)); p.appendChild(r); }
      var form = el('div','spell');
      var inp = document.createElement('input');
      inp.type = 'text'; inp.setAttribute('aria-label','輸入英文');
      inp.autocomplete = 'off'; inp.autocapitalize = 'none'; inp.spellcheck = false;
      inp.setAttribute('autocorrect','off');
      var go = el('button','primary','送出');
      var fb = el('div','fb'); fb.setAttribute('role','status');
      function submit(){
        if(answered) return;
        var v = norm(inp.value); if(!v) return;
        var accept = words.filter(function(w){ return norm(w.zh) === norm(cur.zh); }).map(function(w){ return norm(w.en); });
        var ok = accept.indexOf(v) >= 0;
        inp.disabled = true; go.disabled = true;
        fb.className = 'fb ' + (ok ? 'ok' : 'bad');
        fb.textContent = ok ? '答對了！' : '正確答案：' + cur.en;
        if(cfg.auto) speak(cur.en);
        finish(ok);
      }
      go.onclick = submit;
      inp.onkeydown = function(e){ if(e.key === 'Enter') submit(); };
      form.appendChild(inp); form.appendChild(go);
      p.appendChild(form); p.appendChild(fb);
      setTimeout(function(){ inp.focus(); }, 0);
    }
    p.appendChild(next);
    var quit = el('button','ghost full','結束練習'); quit.onclick = renderSetup;
    p.appendChild(quit);
  }

  /* ---------- 句型填空 ---------- */
  function clozeBody(p, cur, type, finish){
    var parts = cur.en.split(/_{2,}/), n = cur.ans.length;
    function full(){
      var s = parts[0];
      for(var i=0;i<n;i++) s += cur.ans[i][0] + parts[i+1];
      return s;
    }
    function isRight(i, v){ return cur.ans[i].map(norm).indexOf(norm(v)) >= 0; }
    p.appendChild(el('p','hint msg', type==='choice' ? '選出適合填入空格的字' : '把空格填完整'));
    p.appendChild(el('div','zhq small',cur.zh));
    var sent = el('div','cloze'); p.appendChild(sent);
    var fb = el('div','fb'); fb.setAttribute('role','status');
    function reveal(ok){
      fb.className = 'fb ' + (ok ? 'ok' : 'bad');
      fb.textContent = (ok ? '答對了！' : '正確答案：') + full();
      if(HAS_TTS) fb.appendChild(speakBtn(full()));
      if(cfg.auto) speak(full());
      finish(ok);
    }

    if(type === 'choice'){
      var slots = [], allOk = true, bi = 0, opts = el('div','options');
      parts.forEach(function(t,i){
        sent.appendChild(document.createTextNode(t));
        if(i < n){ var s = el('span','slot','＿'); slots.push(s); sent.appendChild(s); }
      });
      var round = function(){
        slots.forEach(function(s,i){ if(i === bi) s.classList.add('active'); else s.classList.remove('active'); });
        opts.textContent = '';
        clozeOptions(cur.ans[bi]).forEach(function(text){
          var b = el('button','opt',text);
          b.onclick = function(){
            var good = isRight(bi, text);
            Array.prototype.forEach.call(opts.children, function(o){
              o.disabled = true;
              if(isRight(bi, o.textContent)) o.classList.add('ok');
              else if(o === b) o.classList.add('bad');
            });
            slots[bi].textContent = text;
            slots[bi].className = 'slot ' + (good ? 'ok' : 'bad');
            if(!good) allOk = false;
            bi++;
            if(bi < n) setTimeout(round, 700); else reveal(allOk);
          };
          opts.appendChild(b);
        });
      };
      p.appendChild(opts); p.appendChild(fb); round();
    }else{
      var inputs = [], done = false;
      parts.forEach(function(t,i){
        sent.appendChild(document.createTextNode(t));
        if(i < n){
          var inp = document.createElement('input');
          inp.type = 'text'; inp.autocomplete = 'off'; inp.autocapitalize = 'none';
          inp.spellcheck = false; inp.setAttribute('autocorrect','off');
          inp.setAttribute('aria-label','第 ' + (i+1) + ' 個空格');
          var len = Math.max.apply(null, cur.ans[i].map(function(a){ return a.length; }));
          inp.style.width = Math.max(4, len + 2) + 'ch';
          inputs.push(inp); sent.appendChild(inp);
        }
      });
      var go = el('button','primary full','送出');
      var submit = function(){
        if(done) return;
        if(inputs.some(function(x){ return !x.value.trim(); })){
          fb.className = 'fb bad'; fb.textContent = '請把每個空格都填完'; return;
        }
        done = true;
        var ok = true;
        inputs.forEach(function(x,i){
          var g = isRight(i, x.value);
          x.disabled = true; x.className = g ? 'ok' : 'bad';
          if(!g) ok = false;
        });
        go.disabled = true;
        reveal(ok);
      };
      inputs.forEach(function(x,i){
        x.onkeydown = function(e){
          if(e.key !== 'Enter') return;
          if(i < inputs.length-1) inputs[i+1].focus(); else submit();
        };
      });
      go.onclick = submit;
      p.appendChild(go); p.appendChild(fb);
      setTimeout(function(){ inputs[0].focus(); }, 0);
    }
  }

  function renderEnd(p){
    p.appendChild(el('p','msg','練習完成'));
    p.appendChild(el('div','score', quiz.score + ' / ' + quiz.list.length));
    if(quiz.wrong.length){
      p.appendChild(el('p','msg','答錯的題目：'));
      var ul = el('ul','wrong-list');
      quiz.wrong.forEach(function(w){
        var line = w.kind === 'cloze'
          ? w.en.split(/_{2,}/).reduce(function(s,t,i){ return s + (i ? w.ans[i-1][0] : '') + t; }, '')
          : w.en;
        ul.appendChild(el('li',null,line + '：' + w.zh + '（' + w.lesson + '）'));
      });
      p.appendChild(ul);
      var rev = el('button','primary full','只複習答錯的');
      rev.onclick = function(){ begin(shuffle(quiz.wrong)); };
      p.appendChild(rev);
    }
    var again = el('button', quiz.wrong.length ? 'ghost full' : 'primary full', '再練一次');
    again.onclick = function(){
      var n = quiz.list.length;
      var pool = src().filter(function(w){ return w.book===cfg.book && cfg.lessons.indexOf(w.lesson)>=0; });
      begin(shuffle(pool).slice(0, n));
    };
    p.appendChild(again);
    var back = el('button','ghost full','回到設定'); back.onclick = renderSetup;
    p.appendChild(back);
  }

  loadItems();
})();
</script>
</body>
